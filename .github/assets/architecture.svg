<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" width="800" height="512" role="img" aria-labelledby="title desc">
  <title id="title">dwim module layers</title>
  <desc id="desc">The modules of dwim and what each imports. cli uses every module. harness imports tools and model; providers import model and sys; server imports inference and model; inference imports model and gpu; tools, model and gpu import sys.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <style>
    .box     { stroke-width: 1.25; }
    .neutral { fill: #f6f8fa; stroke: #d0d7de; }
    .agent   { fill: #ddf4ff; stroke: #54aeff; }
    .engine  { fill: #fbefff; stroke: #c297ff; }
    .name    { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .what    { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .key     { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .edge    { stroke: #818b98; stroke-width: 1.5; fill: none; }
    .head    { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .neutral { fill: #151b23; stroke: #3d444d; }
      .agent   { fill: #0c2d6b; stroke: #1f6feb; }
      .engine  { fill: #2e1461; stroke: #8957e5; }
      .name    { fill: #f0f6fc; }
      .what, .key { fill: #9198a1; }
      .edge    { stroke: #656c76; }
      .head    { fill: #656c76; }
    }
  </style>

  <!-- Edges: every one points down, from the module that imports to the one imported. -->
  <g class="edge" marker-end="url(#arrow)">
    <line x1="105" y1="168" x2="105" y2="219"/>  <!-- harness -> tools -->
    <line x1="420" y1="168" x2="420" y2="319"/>  <!-- harness -> model -->
    <line x1="500" y1="168" x2="500" y2="319"/>  <!-- server -> model -->
    <line x1="660" y1="168" x2="660" y2="219"/>  <!-- server -> inference -->
    <line x1="340" y1="268" x2="340" y2="319"/>  <!-- providers -> model -->
    <line x1="230" y1="268" x2="230" y2="419"/>  <!-- providers -> sys -->
    <line x1="580" y1="268" x2="580" y2="319"/>  <!-- inference -> model -->
    <line x1="695" y1="268" x2="695" y2="319"/>  <!-- inference -> gpu -->
    <line x1="105" y1="268" x2="105" y2="419"/>  <!-- tools -> sys -->
    <line x1="440" y1="368" x2="440" y2="419"/>  <!-- model -> sys -->
    <line x1="695" y1="368" x2="695" y2="419"/>  <!-- gpu -> sys -->
  </g>

  <!-- cli -->
  <rect class="box neutral" x="40" y="20" width="720" height="48" rx="8"/>
  <text class="name" x="400" y="40" text-anchor="middle">cli</text>
  <text class="what" x="400" y="57" text-anchor="middle">the dwim command; uses every module below</text>

  <!-- Row 1 -->
  <rect class="box agent" x="40" y="120" width="400" height="48" rx="8"/>
  <text class="name" x="240" y="140" text-anchor="middle">harness</text>
  <text class="what" x="240" y="157" text-anchor="middle">the agent: prompt, tool loop, plan, compaction</text>

  <rect class="box engine" x="480" y="120" width="280" height="48" rx="8"/>
  <text class="name" x="620" y="140" text-anchor="middle">server</text>
  <text class="what" x="620" y="157" text-anchor="middle">the process that has the model</text>

  <!-- Row 2 -->
  <rect class="box agent" x="40" y="220" width="130" height="48" rx="8"/>
  <text class="name" x="105" y="240" text-anchor="middle">tools</text>
  <text class="what" x="105" y="257" text-anchor="middle">bash, read, edit…</text>

  <rect class="box agent" x="200" y="220" width="160" height="48" rx="8"/>
  <text class="name" x="280" y="240" text-anchor="middle">providers</text>
  <text class="what" x="280" y="257" text-anchor="middle">dwim server, OpenRouter</text>

  <rect class="box engine" x="560" y="220" width="200" height="48" rx="8"/>
  <text class="name" x="660" y="240" text-anchor="middle">inference</text>
  <text class="what" x="660" y="257" text-anchor="middle">the transformer, sampling</text>

  <!-- Row 3 -->
  <rect class="box neutral" x="280" y="320" width="320" height="48" rx="8"/>
  <text class="name" x="440" y="340" text-anchor="middle">model</text>
  <text class="what" x="440" y="357" text-anchor="middle">chat format, tokenizer, GGUF header, sizing</text>

  <rect class="box engine" x="630" y="320" width="130" height="48" rx="8"/>
  <text class="name" x="695" y="340" text-anchor="middle">gpu</text>
  <text class="what" x="695" y="357" text-anchor="middle">Metal, Vulkan, CPU</text>

  <!-- Row 4 -->
  <rect class="box neutral" x="40" y="420" width="720" height="48" rx="8"/>
  <text class="name" x="400" y="440" text-anchor="middle">sys</text>
  <text class="what" x="400" y="457" text-anchor="middle">the operating system: darwin, linux, unix</text>

  <!-- Key -->
  <rect class="box agent" x="40" y="488" width="12" height="12" rx="3"/>
  <text class="key" x="58" y="498">agent side</text>
  <rect class="box engine" x="136" y="488" width="12" height="12" rx="3"/>
  <text class="key" x="154" y="498">engine side</text>
  <rect class="box neutral" x="240" y="488" width="12" height="12" rx="3"/>
  <text class="key" x="258" y="498">shared</text>
  <text class="key" x="760" y="498" text-anchor="end">an arrow points from a module to one it imports</text>
</svg>
