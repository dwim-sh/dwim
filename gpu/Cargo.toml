[package]
name = "dwim-gpu"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }

[dependencies]
ash = "0.38.0"
rayon = "1.12.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
